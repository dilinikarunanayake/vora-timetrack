<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 460" role="img" aria-labelledby="t d">
  <title id="t">How Vora TimeTrack works</title>
  <desc id="d">An architecture-style diagram: engineers log time, it becomes a weekly timesheet, a manager approves it, and approved hours feed reports and billing. All four connect to the TimeTrack database in the centre.</desc>
  <style>
    .panel { fill: #04224f; stroke: #1d4a8a; }
    .node { fill: #0b2f63; stroke: #2d5a9a; stroke-width: 1.25; }
    .ico { fill: none; stroke: #e8f0fb; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .acc { stroke: #29a8e8; }
    .accfill { fill: #29a8e8; }
    .title { fill: #f2f6fc; font: 600 15px -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .sub { fill: #9db4d6; font: 400 11.5px -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .db { fill: #0a6fd1; stroke: #29a8e8; stroke-width: 1.25; }
    .dbtext { fill: #ffffff; font: 600 11px -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .wire { fill: none; stroke: #4c7fc4; stroke-width: 2; }
    .link { fill: none; stroke: #2d5a9a; stroke-width: 1.25; stroke-dasharray: 4 4; }
    .packet { fill: #8fd8ff; opacity: 0; animation: 6s linear infinite; }
    .p1 { animation-name: ab; }
    .p2 { animation-name: bc; }
    .p3 { animation-name: cd; }
    @keyframes ab { 0% { transform: translate(244px,104px); opacity: 1 } 30% { transform: translate(350px,104px); opacity: 1 } 31%,100% { opacity: 0; transform: translate(350px,104px) } }
    @keyframes bc { 0%,33% { opacity: 0; transform: translate(465px,172px) } 34% { opacity: 1; transform: translate(465px,172px) } 63% { transform: translate(465px,282px); opacity: 1 } 64%,100% { opacity: 0; transform: translate(465px,282px) } }
    @keyframes cd { 0%,66% { opacity: 0; transform: translate(356px,356px) } 67% { opacity: 1; transform: translate(356px,356px) } 96% { transform: translate(250px,356px); opacity: 1 } 97%,100% { opacity: 0; transform: translate(250px,356px) } }
    @media (prefers-reduced-motion: reduce) { .packet { animation: none; opacity: 0; } }
  </style>
  <defs>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.2" fill="#163f7a"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#4c7fc4"/>
    </marker>
  </defs>

  <rect class="panel" x="0.5" y="0.5" width="599" height="459" rx="18"/>
  <rect x="1" y="1" width="598" height="458" rx="18" fill="url(#dots)"/>

  <!-- Dashed links: every step reads and writes the same database -->
  <path class="link" d="M240 168 L268 204"/>
  <path class="link" d="M360 168 L332 204"/>
  <path class="link" d="M360 292 L332 256"/>
  <path class="link" d="M240 292 L268 256"/>

  <!-- Central database -->
  <g>
    <path class="db" d="M262 210 v40 a38 10 0 0 0 76 0 v-40"/>
    <ellipse class="db" cx="300" cy="210" rx="38" ry="10"/>
    <path d="M262 226 a38 10 0 0 0 76 0" fill="none" stroke="#29a8e8" stroke-width="1.25"/>
    <text class="dbtext" x="300" y="246" text-anchor="middle">TimeTrack</text>
  </g>

  <!-- Workflow wires -->
  <path class="wire" d="M240 104 H352" marker-end="url(#arrow)"/>
  <path class="wire" d="M465 168 V284" marker-end="url(#arrow)"/>
  <path class="wire" d="M360 356 H248" marker-end="url(#arrow)"/>

  <!-- 1 Log time -->
  <g transform="translate(30 40)">
    <rect class="node" width="210" height="128" rx="12"/>
    <g transform="translate(18 16)" class="ico">
      <rect x="6" y="7" width="32" height="22" rx="2.5"/>
      <path d="M2 33 H42 L39 37 H5 Z"/>
      <circle class="acc" cx="22" cy="18" r="6.5"/>
      <path class="acc" d="M22 14.5 V18 L24.5 19.5"/>
    </g>
    <text class="title" x="18" y="88">Log time</text>
    <text class="sub" x="18" y="108">Daily, against client tasks</text>
  </g>

  <!-- 2 Weekly timesheet -->
  <g transform="translate(360 40)">
    <rect class="node" width="210" height="128" rx="12"/>
    <g transform="translate(18 16)" class="ico">
      <rect x="3" y="5" width="38" height="33" rx="3"/>
      <path d="M3 13 H41"/>
      <path d="M12 2 V8 M32 2 V8"/>
      <g class="accfill" stroke="none">
        <rect x="8" y="24" width="3.5" height="10" rx="1"/>
        <rect x="13.5" y="21" width="3.5" height="13" rx="1"/>
        <rect x="19" y="23" width="3.5" height="11" rx="1"/>
        <rect x="24.5" y="20" width="3.5" height="14" rx="1"/>
        <rect x="30" y="25" width="3.5" height="9" rx="1"/>
      </g>
    </g>
    <text class="title" x="18" y="88">Weekly timesheet</text>
    <text class="sub" x="18" y="108">One per person, Mon to Sun</text>
  </g>

  <!-- 3 Manager approval -->
  <g transform="translate(360 292)">
    <rect class="node" width="210" height="128" rx="12"/>
    <g transform="translate(18 16)" class="ico">
      <path d="M22 4 L37 10 V21 C37 30 30 36 22 39 C14 36 7 30 7 21 V10 Z"/>
      <path class="acc" d="M15 21.5 L20 26.5 L29 16.5"/>
    </g>
    <text class="title" x="18" y="88">Manager approval</text>
    <text class="sub" x="18" y="108">Approve, or return with a note</text>
  </g>

  <!-- 4 Reports & billing -->
  <g transform="translate(30 292)">
    <rect class="node" width="210" height="128" rx="12"/>
    <g transform="translate(18 16)" class="ico">
      <path d="M4 4 V38 H40"/>
      <path class="acc" d="M11 30 V24 M19 30 V16 M27 30 V20"/>
      <circle cx="35" cy="12" r="7" fill="#f2a541" stroke="#f2a541"/>
      <text x="35" y="16" text-anchor="middle" fill="#04224f" stroke="none" style="font: 700 10px -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">£</text>
    </g>
    <text class="title" x="18" y="88">Reports and billing</text>
    <text class="sub" x="18" y="108">Approved hours × billing rates</text>
  </g>

  <!-- One packet of data travelling through the workflow -->
  <circle class="packet p1" r="5"/>
  <circle class="packet p2" r="5"/>
  <circle class="packet p3" r="5"/>
</svg>
