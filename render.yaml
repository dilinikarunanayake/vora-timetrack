# Render "Blueprint": describes the live setup so Render can create it in one go.
# Render reads this file when you choose New -> Blueprint in the dashboard.
# Prices and plan names: check https://render.com/pricing before you confirm.

databases:
  - name: vora-timetrack-db
    databaseName: vora_timetrack
    user: vora_timetrack
    region: frankfurt          # EU data centre (Germany)
    plan: basic-256mb          # smallest paid plan: includes point-in-time recovery

services:
  - type: web
    name: vora-timetrack
    runtime: python
    region: frankfurt          # same region as the database
    plan: starter              # always on; the free plan sleeps after 15 minutes
    buildCommand: bash build.sh
    startCommand: gunicorn config.wsgi:application --workers 2 --timeout 60 --access-logfile -
    healthCheckPath: /healthz/
    autoDeploy: true           # redeploy automatically when you push to GitHub
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: vora-timetrack-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true    # Render creates a long random key; nobody needs to see it
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: ""              # add your own domain here later, e.g. timetrack.voraglobalsolutions.com
      - key: PYTHON_VERSION
        value: "3.13.9"
