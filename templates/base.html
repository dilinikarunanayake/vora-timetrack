{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Vora TimeTrack{% endblock %}</title>
  <!-- Bootstrap 5 from a CDN: gives us ready-made layout, buttons, tables, cards -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <!-- Our own styles, loaded after Bootstrap so they can override it -->
  <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>
<body class="d-flex flex-column min-vh-100">

  <nav class="navbar navbar-expand-md navbar-dark vora-nav">
    <div class="container">
      <a class="navbar-brand fw-semibold" href="{% url 'core:home' %}">Vora <span class="text-accent">TimeTrack</span></a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav"
              aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="mainNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="{% url 'core:home' %}">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="{% url 'core:dashboard' %}">Dashboard</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="flex-grow-1">
    {% block content %}{% endblock %}
  </main>

  <footer class="py-3 border-top bg-white">
    <div class="container small text-muted d-flex justify-content-between">
      <span>Vora TimeTrack &middot; Vora Global Solutions &amp; Vora Nexus</span>
      <span>Phase 1 &ndash; development build</span>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
