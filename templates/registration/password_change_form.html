{% extends "base.html" %}

{% block title %}Change password &ndash; Vora TimeTrack{% endblock %}

{% block content %}
<div class="container py-4" style="max-width: 560px">
  <h1 class="h3 fw-bold mb-3">Change password</h1>
  <div class="card"><div class="card-body">
    <form method="post">
      {% csrf_token %}
      {% include "includes/form_fields.html" %}
      <button type="submit" class="btn btn-accent">Change password</button>
    </form>
  </div></div>
</div>
{% endblock %}
